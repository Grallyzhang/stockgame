name = "stock-town-deepseek-proxy"
main = "index.js"
compatibility_date = "2026-01-01"

# ===== 部署步骤 =====
# 1. npm install -g wrangler
# 2. wrangler login                    （浏览器授权 Cloudflare 账号）
# 3. cd worker
# 4. wrangler secret put DEEPSEEK_API_KEY   （粘贴新密钥；密钥绝不写进任何文件）
# 5. wrangler deploy
# 6. 把输出的 https://stock-town-deepseek-proxy.<你的子域>.workers.dev
#    填入 js/ai.js 顶部的 PROXY_URL 常量
#
# ===== 可选加固 =====
# 限制只许你的站点调用（取消注释并改成你的域名）：
# [vars]
# ALLOWED_ORIGIN = "https://<你的用户名>.github.io"
#
# 强烈建议再到 Cloudflare 仪表盘加一条速率限制：
#   安全性 → WAF → 速率限制规则 → 每 IP 每分钟 10 次（免费套餐可用）
